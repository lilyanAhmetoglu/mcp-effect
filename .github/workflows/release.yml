name: Release

# Publishes to npm when a version tag is pushed, for example v0.1.1.
# It uses npm trusted publishing (OIDC), so there is no npm token to store.
# One-time setup on npmjs.com is described in docs/releasing.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # lets npm verify that this workflow is the publisher

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, which trusted publishing needs
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish
