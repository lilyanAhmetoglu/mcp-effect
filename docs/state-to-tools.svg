<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" role="img" aria-labelledby="t d">
<title id="t">State decides which tools the model can see</title>
<desc id="d">Two panels. When order status is paid, the model sees one tool: get_order. When order status is failed, the model sees three tools: get_order, refund_order and email_customer.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606A"/></marker>
  <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/></marker>
</defs>
<rect width="960" height="444" rx="16" fill="#FBFAF7"/>
<text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2328" text-anchor="start">State decides which tools exist</text>
<text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#57606A" text-anchor="start">Same servers, same model. Only the state is different.</text>
<rect x="40" y="104" width="420" height="304" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="64" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#57606A" text-anchor="start">STATE</text>
<rect x="64" y="150" width="372" height="38" rx="8" fill="#F1F2F4"/>
<text x="80" y="174" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1F2328" text-anchor="start">order.status = "paid"</text>
<line x1="250" y1="196" x2="250" y2="222" stroke="#57606A" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="64" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#57606A" text-anchor="start">WHAT THE MODEL SEES</text>
<rect x="64" y="262" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.5"/>
