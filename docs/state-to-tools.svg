<text x="64" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57606A" text-anchor="start">Hidden tools cannot be called, even by a client with an old list.</text>
