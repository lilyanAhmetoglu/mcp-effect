<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
<title id="t">useEffect in React next to useTools in mcp-effect</title>
<desc id="d">Left: a React useEffect with a dependency array. Right: an mcp-effect useTools rule with a dependency array. In both, the code runs again only when a dependency changes.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606A"/></marker>
  <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/></marker>
</defs>
<rect width="960" height="400" rx="16" fill="#FBFAF7"/>
<text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2328" text-anchor="start">The idea in one picture</text>
<text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#57606A" text-anchor="start">You already know this pattern from React. mcp-effect uses it for tools.</text>
<rect x="40" y="104" width="410" height="256" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="64" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#57606A" text-anchor="start">React</text>
<text x="64" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2328" text-anchor="start">An effect runs when its deps change</text>
<text x="64" y="198" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1F2328" xml:space="preserve">useEffect(() =&gt; {</text>
<text x="64" y="220" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1F2328" xml:space="preserve">  connect(roomId);</text>
<text x="64" y="242" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1F2328" xml:space="preserve">  return () =&gt; disconnect(roomId);</text>
<text x="64" y="264" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#9A5B00" xml:space="preserve">}, [roomId]);</text>
<rect x="64" y="298" width="362" height="40" rx="8" fill="#FFF4DC"/>
<text x="80" y="323" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#9A5B00" text-anchor="start">deps:  [roomId]   →   run the effect again</text>
<rect x="510" y="104" width="410" height="256" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
<text x="534" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start">mcp-effect</text>
<text x="534" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2328" text-anchor="start">Tools mount when their deps change</text>
<text x="534" y="198" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1F2328" xml:space="preserve">gateway.useTools({</text>
<text x="534" y="220" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#0F766E" xml:space="preserve">  deps: ['order.status'],</text>
<text x="534" y="242" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1F2328" xml:space="preserve">  tools: s =&gt; failed(s) ? ['refund'] : []</text>
<text x="534" y="264" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1F2328" xml:space="preserve">});</text>
<rect x="534" y="298" width="362" height="40" rx="8" fill="#E6F4F1"/>
<text x="550" y="323" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#0F766E" text-anchor="start">deps:  [order.status]  →  mount or unmount</text>
<line x1="458" y1="232" x2="502" y2="232" stroke="#57606A" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">same</text>
<text x="480" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">idea</text>
</svg>
