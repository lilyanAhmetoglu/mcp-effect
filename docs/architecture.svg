<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
<title id="t">How mcp-effect sits between an MCP client and MCP servers</title>
<desc id="d">An MCP client talks to the mcp-effect gateway. The gateway holds rules and state per caller, and checks every list and every call. Behind it are upstream MCP servers. State comes from outside: your app, a webhook, a state file or the admin API.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606A"/></marker>
  <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/></marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9A5B00"/></marker>
</defs>
<rect width="960" height="560" rx="16" fill="#FBFAF7"/>
<text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2328" text-anchor="start">How it works</text>
<text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#57606A" text-anchor="start">The gateway sits in the middle. It answers every list and checks every call.</text>
<rect x="40" y="120" width="200" height="200" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="140" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2328" text-anchor="middle">MCP client</text>
<text x="140" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606A" text-anchor="middle">Claude Code, Cursor,</text>
<text x="140" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606A" text-anchor="middle">or your own agent</text>
<text x="140" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#57606A" text-anchor="middle">sees only</text>
<rect x="72" y="244" width="136" height="30" rx="15" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.5"/>
<text x="140.0" y="264" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#1F2328" text-anchor="middle">read_logs</text>
<rect x="72" y="280" width="136" height="30" rx="15" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.5"/>
<text x="140.0" y="300" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">deploy</text>
<rect x="310" y="104" width="340" height="256" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
<text x="480" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F766E" text-anchor="middle">mcp-effect gateway</text>
<rect x="330" y="154" width="300" height="46" rx="8" fill="#FBFAF7" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="346" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1F2328" text-anchor="start">1  Rules</text>
<text x="346" y="191" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#57606A" text-anchor="start">useTools: deps → tools</text>
<rect x="330" y="210" width="300" height="46" rx="8" fill="#FBFAF7" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="346" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1F2328" text-anchor="start">2  State, per caller</text>
<text x="346" y="247" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#57606A" text-anchor="start">global + user:alice + ...</text>
<rect x="330" y="266" width="300" height="54" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.5"/>
<text x="346" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F766E" text-anchor="start">3  Check on every call</text>
<text x="346" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F2328" text-anchor="start">An unmounted tool is refused.</text>
<rect x="720" y="104" width="200" height="118" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="820" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328" text-anchor="middle">release server</text>
<rect x="752" y="142" width="136" height="30" rx="15" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.5"/>
<text x="820.0" y="162" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#1F2328" text-anchor="middle">read_logs</text>
<rect x="752" y="180" width="136" height="30" rx="15" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.5"/>
<text x="820.0" y="200" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">deploy</text>
<rect x="720" y="240" width="200" height="120" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="820" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2328" text-anchor="middle">payments server</text>
<rect x="744" y="280" width="152" height="30" rx="15" fill="#F1F2F4" stroke="#8C959F" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="820.0" y="300" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#8C959F" text-anchor="middle">send_money</text>
<rect x="744" y="318" width="152" height="30" rx="15" fill="#F1F2F4" stroke="#8C959F" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="820.0" y="338" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#8C959F" text-anchor="middle">refund_payment</text>
<line x1="240" y1="190" x2="304" y2="190" stroke="#57606A" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="272" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">list</text>
<line x1="304" y1="250" x2="246" y2="250" stroke="#57606A" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="272" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">tools</text>
<line x1="650" y1="160" x2="714" y2="160" stroke="#57606A" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650" y1="300" x2="714" y2="300" stroke="#57606A" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="682" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#57606A" text-anchor="middle">call</text>
<text x="682" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8C959F" text-anchor="middle">blocked</text>
<rect x="180" y="420" width="600" height="100" rx="12" fill="#FFF4DC" stroke="#9A5B00" stroke-width="1.5"/>
<text x="480" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#9A5B00" text-anchor="middle">State comes from outside the conversation</text>
<rect x="204" y="468" width="126" height="32" rx="8" fill="#FFFFFF" stroke="#9A5B00" stroke-width="1.2"/>
<text x="267" y="489" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F2328" text-anchor="middle">an Approve button</text>
<rect x="346" y="468" width="126" height="32" rx="8" fill="#FFFFFF" stroke="#9A5B00" stroke-width="1.2"/>
<text x="409" y="489" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2328" text-anchor="middle">a webhook</text>
<rect x="488" y="468" width="126" height="32" rx="8" fill="#FFFFFF" stroke="#9A5B00" stroke-width="1.2"/>
<text x="551" y="489" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2328" text-anchor="middle">a state file</text>
<rect x="630" y="468" width="126" height="32" rx="8" fill="#FFFFFF" stroke="#9A5B00" stroke-width="1.2"/>
<text x="693" y="489" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F2328" text-anchor="middle">the admin API</text>
<line x1="480" y1="420" x2="480" y2="366" stroke="#9A5B00" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
<text x="492" y="398" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#9A5B00" text-anchor="start">setState</text>
<text x="40" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606A" text-anchor="start">The model cannot change state by itself. </text>
</svg>
